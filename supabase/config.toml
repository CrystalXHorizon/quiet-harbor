project_id = "quiet-harbor"

[auth]
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_confirmations = true

# Keep the project's current email bodies. Optional token_hash templates are
# examples only; do not upload them without explicitly opting in.
[functions.api]
# api validates the JWT against Supabase Auth for every request itself.
verify_jwt = false
